<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Porcelain's typefaces for the generic families: Instrument Sans for
     sans-serif and Fira Code for monospace. Linked into /etc/fonts/conf.d by
     build_files/build.sh. It sorts before Noto's 56 and 57, whose preferences
     would otherwise come first. Serif is left alone: Instrument Serif is a
     display face with one weight. The ui-* families are left to fontconfig's
     own guessing (48-guessfamily.conf), which an alias here doesn't override.
     The aliases are weak, as Noto's are, so text in another script still
     gets the font fontconfig picks for that language. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Instrument Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Fira Code</family></prefer>
  </alias>
</fontconfig>
