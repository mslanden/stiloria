# Keep the boot splash up until the login screen is about to draw, as GDM does
# on Fedora. The login manager waits for udev to settle (about 3 seconds here)
# after Plymouth's own quit service would have cleared the screen, which left
# the screen black or showing the bare console in between. Now Plymouth quits
# last thing before the greeter starts; if the greeter fails, the quit service
# still runs. A short black frame remains while KWin takes the display: Plymouth
# can't hand its picture over once it exits.
[Unit]
Conflicts=plymouth-quit.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
