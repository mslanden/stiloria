# Dependabot is Stiloria's one dependency updater: it opens pull requests
# for the GitHub Actions the workflows use, which are pinned by commit SHA
# with the version in a comment, and its pull requests update both. They
# build without Achilles (they can't read its deploy key); see the README.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
