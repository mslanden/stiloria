# Anaconda's settings for installing Stiloria, as Bazzite's installer sets them
# (installer/system_files/shared/etc/anaconda/profile.d/bazzite.conf).

[Profile]
profile_id = stiloria

[Profile Detection]
# Stiloria keeps Bazzite's os-release ID.
os_id = bazzite

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
# Everything to install is on the stick; the network page isn't needed.
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
